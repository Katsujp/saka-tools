<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Streamlit Paste Bridge Component</title>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --bg-hover: #2c2c2e;
            --bg-card: #2c2c2e;
            --accent-color: #0071e3; /* Apple SF Pro Blue */
            --accent-hover: #147ce5;
            --accent-active: #0062c4;
            --border-color: #3a3a3c;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: var(--font-family);
            color: var(--text-color);
        }

        #paste-container {
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 10px 16px;
            background-color: var(--bg-color);
            box-sizing: border-box;
            width: 100%;
            height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        #paste-container.dragover {
            background-color: var(--bg-hover) !important;
            border-color: var(--accent-color) !important;
            border-style: solid !important;
        }

        .button-group {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            flex: 1;
            max-width: 220px;
            height: 38px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: not-allowed;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
            outline: none;
            color: #ffffff;
        }

        .btn-primary {
            background-color: var(--accent-color);
        }

        .btn-secondary {
            background-color: #3a3a3c;
            border: 1px solid #48484a;
        }

        .ready .btn {
            cursor: pointer;
            opacity: 1;
        }

        .ready .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .ready .btn-primary:active {
            background-color: var(--accent-active);
            transform: scale(0.98);
        }

        .ready .btn-secondary:hover {
            background-color: #48484a;
        }

        .ready .btn-secondary:active {
            background-color: #3a3a3c;
            transform: scale(0.98);
        }

        #status-indicator {
            font-size: 10px;
            color: #ff453a; /* Apple System Red */
            font-weight: 500;
            letter-spacing: 0.05em;
            text-align: center;
            margin-top: 4px;
        }

        #status-indicator.ready {
            color: #30d158; /* Apple System Green */
        }
    </style>
</head>
<body>
    <div id="paste-container">
        <div class="button-group">
            <button id="btn-paste-api" class="btn btn-primary" type="button" disabled>
                📋 クリップボードから貼付け
            </button>
            <button id="btn-select-file" class="btn btn-secondary" type="button" disabled>
                📷 ファイル/カメラから選択
            </button>
        </div>

        <input type="file" id="hidden-file-input" accept="image/*" style="display: none;">
        
        <div id="status-indicator">システム初期化中...</div>
    </div>

    <script>
        console.log("[PasteBridge] Loading PasteBridge (Lightweight Edition). Initializing...");

        const pasteContainer = document.getElementById('paste-container');
        const btnPasteApi = document.getElementById('btn-paste-api');
        const btnSelectFile = document.getElementById('btn-select-file');
        const hiddenFileInput = document.getElementById('hidden-file-input');
        const statusIndicator = document.getElementById('status-indicator');

        let isReady = false;

        // 親のStreamlit側にメッセージを送信するヘルパー関数
        function sendMessageToStreamlit(type, payload = {}) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type
            }, payload), "*");
        }

        // 初期接続シーケンスの開始
        function initializeConnection() {
            sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
        }

        // Streamlitからのマウントシグナルを受信
        window.addEventListener("message", (event) => {
            if (event && event.data && event.data.type === "streamlit:render") {
                if (!isReady) {
                    isReady = true;
                    
                    // UI部品を有効化
                    pasteContainer.className = "ready";
                    btnPasteApi.removeAttribute("disabled");
                    btnSelectFile.removeAttribute("disabled");
                    
                    statusIndicator.className = "ready";
                    statusIndicator.innerText = "接続完了：貼り付け準備完了";
                    
                    // コンポーネントの高さをコンパクトな 80px に設定
                    sendMessageToStreamlit("streamlit:setFrameHeight", { height: 80 });
                    attachEvents();
                }
            }
        });

        // イベントリスナーの登録
        function attachEvents() {
            // 1. クリップボードAPI経由での貼付けボタンの動作定義
            btnPasteApi.addEventListener('click', async () => {
                if (!isReady) return;
                
                statusIndicator.innerText = "クリップボードの読み取り中...";
                statusIndicator.className = "";
                
                try {
                    if (!navigator.clipboard || !navigator.clipboard.read) {
                        throw new Error("ブラウザがクリップボード画像読み取りAPIに対応していないか、制限されています。");
                    }
                    
                    const items = await navigator.clipboard.read();
                    let imageFound = false;
                    
                    for (const item of items) {
                        for (const type of item.types) {
                            if (type.startsWith('image/')) {
                                const blob = await item.getType(type);
                                handleFile(blob);
                                imageFound = true;
                                break;
                            }
                        }
                        if (imageFound) break;
                    }
                    
                    if (!imageFound) {
                        alert("クリップボードに画像が見つかりませんでした。先にゲーム画面等のスクリーンショットをコピーしてください。");
                        resetStatus();
                    }
                } catch (err) {
                    console.error("[PasteBridge] Clipboard API Error: ", err);
                    alert("クリップボードから直接貼り付けられませんでした。\n非HTTPS環境であるか、権限がありません。\n\n【解決策】\n「ファイル/カメラから選択」ボタンをご利用ください。");
                    resetStatus();
                }
            });

            // 2. インラインファイル/カメラアップローダーボタンの動作定義
            btnSelectFile.addEventListener('click', () => {
                if (!isReady) return;
                hiddenFileInput.click();
            });

            hiddenFileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    handleFile(e.target.files[0]);
                }
            });

            // 3. デスクトップ向けドラッグ＆ドロップ動作定義
            pasteContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (isReady) {
                    pasteContainer.classList.add('dragover');
                }
            });

            pasteContainer.addEventListener('dragleave', () => {
                if (isReady) {
                    pasteContainer.classList.remove('dragover');
                }
            });

            pasteContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                if (!isReady) return;
                pasteContainer.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });
        }

        // 読み込んだ画像ファイルの処理およびBase64エンコード送信
        function handleFile(fileOrBlob) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                
                // 重複ロードを根本防止するためワンタイムIDを付与してStreamlitへ送信
                sendMessageToStreamlit("streamlit:setComponentValue", { 
                    value: {
                        id: "paste_" + Date.now() + "_" + Math.random().toString(36).substr(2, 9),
                        data: base64Data
                    }
                });
                
                statusIndicator.style.color = "#30d158";
                statusIndicator.innerText = "画像を正常にロードしました";
                
                setTimeout(() => {
                    resetStatus();
                }, 2000);
            };
            
            reader.readAsDataURL(fileOrBlob);
        }

        // ステータス表示のリセット
        function resetStatus() {
            if (isReady) {
                statusIndicator.style.color = "";
                statusIndicator.className = "ready";
                statusIndicator.innerText = "接続完了：貼り付け準備完了";
            }
        }

        // 接続シーケンスの初期化実行
        initializeConnection();
    </script>
</body>
</html>
