<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Streamlit Paste Bridge Component</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
        }
        #paste-box {
            border: 3px dashed #e2e8f0;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            background-color: #1a202c;
            color: #a0aec0;
            cursor: not-allowed;
            font-family: 'Outfit', 'Inter', sans-serif;
            font-weight: bold;
            outline: none;
            box-sizing: border-box;
            width: 100%;
            height: 140px;
            transition: all 0.3s ease;
        }
        #paste-box.ready {
            border-color: #00ffaa;
            color: #00ffaa;
            cursor: pointer;
        }
        #paste-box.ready:hover {
            background-color: #2d3748;
        }
        #paste-box.ready:focus {
            box-shadow: 0 0 10px #00ffaa;
        }
        #status-indicator {
            font-size: 11px;
            margin-top: 6px;
            color: #e53e3e;
            font-weight: normal;
            transition: color 0.3s ease;
        }
        #status-indicator.ready {
            color: #38a169;
        }
    </style>
</head>
<body>
    <div id="paste-box" tabindex="0">
        <span style="font-size: 20px; display: block; margin-bottom: 8px;">⏳ 初期化中...</span>
        <span style="font-size: 12px; font-weight: normal;">接続をお待ちください</span>
        <div id="status-indicator">🔴 未接続 (Streamlitの起動を待っています)</div>
    </div>

    <script>
        console.log("[PasteBridge] ロードされました。接続処理を開始します。");

        const pasteBox = document.getElementById('paste-box');
        let isReady = false;

        // Streamlit親フレームにメッセージを送信するヘルパー関数
        function sendMessageToStreamlit(type, payload = {}) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type
            }, payload), "*");
        }

        // 1. ロード完了時に親へ componentReady シグナルを送信（超重要ライフサイクル）
        function initializeConnection() {
            console.log("[PasteBridge] Streamlit親フレームに componentReady を送信中...");
            sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
        }

        // 2. 親フレームからのメッセージ（render）を待ち受けてアクティブ化する
        window.addEventListener("message", (event) => {
            if (event && event.data && event.data.type === "streamlit:render") {
                console.log("[PasteBridge] Streamlit親フレームから render シグナルを受信しました！接続が確立されました。");
                
                if (!isReady) {
                    isReady = true;
                    
                    // UI表示を「アクティブ」へ更新
                    pasteBox.className = "ready";
                    pasteBox.innerHTML = `
                        <span style="font-size: 20px; display: block; margin-bottom: 8px;">📋 ここをクリックして Ctrl + V で貼り付け</span>
                        <span style="font-size: 12px; color: #a0aec0; font-weight: normal;">（または画像ファイルをここに直接ドラッグ＆ドロップ）</span>
                        <div id="status-indicator" class="ready">🟢 接続完了 (貼り付け可能)</div>
                    `;
                    
                    // 高さを親に通知
                    sendMessageToStreamlit("streamlit:setFrameHeight", { height: 140 });
                    
                    // イベントリスナーのアタッチ
                    attachEvents();
                }
            }
        });

        function attachEvents() {
            const activePasteBox = document.getElementById('paste-box');
            
            // フォーカス時にスタイルとコンソールログで追跡可能にする
            activePasteBox.addEventListener('click', () => {
                activePasteBox.focus();
                console.log("[PasteBridge] ペーストボックスがフォーカスされました。貼り付けを受け付けます。");
            });
            
            // ドラッグ＆ドロップハンドラ
            activePasteBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (isReady) {
                    activePasteBox.style.borderColor = '#00cc88';
                    activePasteBox.style.backgroundColor = '#2d3748';
                }
            });
            
            activePasteBox.addEventListener('dragleave', () => {
                if (isReady) {
                    activePasteBox.style.borderColor = '#00ffaa';
                    activePasteBox.style.backgroundColor = '#1a202c';
                }
            });
            
            activePasteBox.addEventListener('drop', (e) => {
                e.preventDefault();
                if (!isReady) return;
                activePasteBox.style.borderColor = '#00ffaa';
                activePasteBox.style.backgroundColor = '#1a202c';
                if (e.dataTransfer.files.length > 0) {
                    console.log("[PasteBridge] ファイルがドロップされました:", e.dataTransfer.files[0].name);
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            // クリップボード貼り付け（Ctrl+V）ハンドラ
            activePasteBox.addEventListener('paste', (e) => {
                if (!isReady) return;
                console.log("[PasteBridge] ペーストイベントが発生しました。クリップボード解析中...");
                const items = (e.clipboardData || window.clipboardData).items;
                let imageFound = false;
                
                for (let item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        console.log("[PasteBridge] 画像データを検出:", file.type);
                        handleFile(file);
                        e.preventDefault();
                        imageFound = true;
                        break;
                    }
                }
                
                if (!imageFound) {
                    console.warn("[PasteBridge] クリップボード内に画像データが見つかりません。");
                }
            });
        }

        // 画像ファイルをBase64エンコードし親へ転送
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                console.log("[PasteBridge] 画像のBase64デコード成功。親プロセスへ転送します。データ長:", base64Data.length);
                
                // 親フレームにデータを送信
                sendMessageToStreamlit("streamlit:setComponentValue", { value: base64Data });
                
                const activePasteBox = document.getElementById('paste-box');
                activePasteBox.innerHTML = `
                    <span style="font-size: 20px; display: block; margin-bottom: 8px; color: #00ffaa;">✅ 読み込み完了！</span>
                    <span style="font-size: 12px; color: #a0aec0;">データを正常に転送しました。</span>
                    <div id="status-indicator" class="ready">🟢 接続完了 (貼り付け可能)</div>
                `;
                
                setTimeout(() => {
                    if (isReady) {
                        activePasteBox.innerHTML = `
                            <span style="font-size: 20px; display: block; margin-bottom: 8px;">📋 ここをクリックして Ctrl + V で貼り付け</span>
                            <span style="font-size: 12px; color: #a0aec0; font-weight: normal;">（または画像ファイルをここに直接ドラッグ＆ドロップ）</span>
                            <div id="status-indicator" class="ready">🟢 接続完了 (貼り付け可能)</div>
                        `;
                    }
                }, 2000);
            };
            
            reader.onerror = function(err) {
                console.error("[PasteBridge] FileReaderエラー:", err);
            };
            
            reader.readAsDataURL(file);
        }

        // ロード時に初期疎通を開始
        initializeConnection();
    </script>
</body>
</html>
