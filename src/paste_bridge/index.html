<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Streamlit Paste Bridge Component</title>
    <style>
        :root {
            --bg-color: #1c1c1e;
            --bg-hover: #2c2c2e;
            --accent-color: #0a84ff; /* SF Pro Blue */
            --border-color: #3a3a3c;
            --text-color: #ffffff;
            --text-secondary: #8e8e93;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: var(--font-family);
        }

        #paste-box {
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 24px 20px;
            text-align: center;
            background-color: var(--bg-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            outline: none;
            box-sizing: border-box;
            width: 100%;
            height: 120px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #paste-box.ready {
            border-color: var(--border-color);
            cursor: pointer;
        }

        #paste-box.ready:hover {
            background-color: var(--bg-hover);
            border-color: var(--text-secondary);
        }

        #paste-box.ready:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        #paste-box.dragover {
            background-color: var(--bg-hover) !important;
            border-color: var(--accent-color) !important;
            border-style: solid !important;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-secondary);
        }

        #status-indicator {
            font-size: 10px;
            margin-top: 8px;
            color: #ff453a; /* Apple System Red */
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #status-indicator.ready {
            color: #30d158; /* Apple System Green */
        }
    </style>
</head>
<body>
    <div id="paste-box" tabindex="0">
        <div class="title">Initializing connection</div>
        <div class="subtitle">Please wait for establishing communication...</div>
        <div id="status-indicator">Disconnected</div>
    </div>

    <script>
        console.log("[PasteBridge] Loading PasteBridge. Initializing...");

        const pasteBox = document.getElementById('paste-box');
        let isReady = false;

        function sendMessageToStreamlit(type, payload = {}) {
            window.parent.postMessage(Object.assign({
                isStreamlitMessage: true,
                type: type
            }, payload), "*");
        }

        function initializeConnection() {
            sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
        }

        window.addEventListener("message", (event) => {
            if (event && event.data && event.data.type === "streamlit:render") {
                if (!isReady) {
                    isReady = true;
                    
                    // UIをApple Proミニマリズム仕様でアクティブ化
                    pasteBox.className = "ready";
                    pasteBox.innerHTML = `
                        <div class="title">Click here and press Ctrl + V to paste image</div>
                        <div class="subtitle">Or drag and drop the image file directly here</div>
                        <div id="status-indicator" class="ready">Ready to paste</div>
                    `;
                    
                    sendMessageToStreamlit("streamlit:setFrameHeight", { height: 120 });
                    attachEvents();
                }
            }
        });

        function attachEvents() {
            const activePasteBox = document.getElementById('paste-box');
            
            activePasteBox.addEventListener('click', () => {
                activePasteBox.focus();
            });
            
            activePasteBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (isReady) {
                    activePasteBox.classList.add('dragover');
                }
            });
            
            activePasteBox.addEventListener('dragleave', () => {
                if (isReady) {
                    activePasteBox.classList.remove('dragover');
                }
            });
            
            activePasteBox.addEventListener('drop', (e) => {
                e.preventDefault();
                if (!isReady) return;
                activePasteBox.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            });

            activePasteBox.addEventListener('paste', (e) => {
                if (!isReady) return;
                const items = (e.clipboardData || window.clipboardData).items;
                let imageFound = false;
                
                for (let item of items) {
                    if (item.kind === 'file' && item.type.startsWith('image/')) {
                        const file = item.getAsFile();
                        handleFile(file);
                        e.preventDefault();
                        imageFound = true;
                        break;
                    }
                }
            });
        }

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const base64Data = event.target.result;
                sendMessageToStreamlit("streamlit:setComponentValue", { value: base64Data });
                
                const activePasteBox = document.getElementById('paste-box');
                activePasteBox.innerHTML = `
                    <div class="title" style="color: #30d158;">Successfully loaded</div>
                    <div class="subtitle">Image has been transferred to reader system</div>
                    <div id="status-indicator" class="ready">Ready to paste</div>
                `;
                
                setTimeout(() => {
                    if (isReady) {
                        activePasteBox.innerHTML = `
                            <div class="title">Click here and press Ctrl + V to paste image</div>
                            <div class="subtitle">Or drag and drop the image file directly here</div>
                            <div id="status-indicator" class="ready">Ready to paste</div>
                        `;
                    }
                }, 2000);
            };
            
            reader.readAsDataURL(file);
        }

        initializeConnection();
    </script>
</body>
</html>
